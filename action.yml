name: 'Octozipo'
description: 'Convert zip packages into git repositories: unzip each package, commit, tag and push it to its repository (creating or updating it).'
author: 'Llewellyn van der Merwe'

branding:
  icon: 'package'
  color: 'gray-dark'

# Every input is empty by default on purpose: an empty input falls back to the
# matching environment variable (VDM_* or GIT_*) and then to the octozipo
# default, so the settings can also be given with an `env:` block.
inputs:
  zip-dir:
    description: 'Directory that holds the zip packages (relative paths are resolved against the workspace). Required, unless VDM_ZIP_DIR is set in the environment.'
    required: false
    default: ''
  org:
    description: 'Organisation/user that owns the repositories, as in git@<git-url>:<org>/<repo>.git. Required, unless VDM_ORG is set in the environment.'
    required: false
    default: ''
  git-url:
    description: 'Host name of the git server the repositories live on (default: git.vdm.dev). Falls back to VDM_GIT_URL.'
    required: false
    default: ''
  push-create:
    description: 'Push to create repositories that do not exist yet, works on Gitea but not on GitHub (default: false). Falls back to VDM_PUSH_CREATE.'
    required: false
    default: ''
  mapper:
    description: 'Path to a mapper file that maps package names to repository names and branches. Falls back to VDM_MAPPER_FILE_PATH.'
    required: false
    default: ''
  env-file:
    description: 'Path to an octozipo environment file (its values override the inputs). Falls back to VDM_ENV_FILE_PATH.'
    required: false
    default: ''
  spacer:
    description: 'Character used between the words of a repository name (default: -). Falls back to VDM_SPACER.'
    required: false
    default: ''
  git-date:
    description: 'Date to use for the git commits (default: now). Falls back to VDM_GIT_DATE.'
    required: false
    default: ''
  use-xml-name:
    description: 'Use the name found in the package XML manifest as the repository name, instead of the zip file name (default: false). Falls back to VDM_USE_XML_NAME.'
    required: false
    default: ''
  keep-repo:
    description: 'Keep the cloned repository directories after processing (default: false). Falls back to VDM_KEEP_REPO.'
    required: false
    default: ''
  keep-zip:
    description: 'Keep the zip packages after processing (default: false). Falls back to VDM_KEEP_ZIP.'
    required: false
    default: ''
  dry-run:
    description: 'Do everything except pushing to the remote repositories (default: false). Falls back to VDM_DRY_RUN.'
    required: false
    default: ''
  quiet:
    description: 'Mute the octozipo info messages, errors are still shown (default: false). Falls back to VDM_QUIET.'
    required: false
    default: ''
  debug:
    description: 'Only print the resolved octozipo configuration, without processing packages (default: false). Falls back to VDM_DEBUG.'
    required: false
    default: ''
  allow-empty:
    description: 'Succeed with a warning when the zip directory holds no packages, instead of failing (default: false). Falls back to VDM_ALLOW_EMPTY.'
    required: false
    default: ''
  report-file:
    description: 'Path of the tab separated report file written by octozipo (default: octozipo-report.tsv in the runner temp directory). Falls back to VDM_REPORT_FILE.'
    required: false
    default: ''
  git-user:
    description: 'Git author name for the commits. Only needed when git is not configured yet (for example by octoleo/git-user). Falls back to GIT_AUTHOR_NAME.'
    required: false
    default: ''
  git-email:
    description: 'Git author email for the commits. Only needed when git is not configured yet. Falls back to GIT_AUTHOR_EMAIL.'
    required: false
    default: ''
  git-signing-key:
    description: 'GPG key id used to sign the commits. Only needed when git is not configured yet. Falls back to GIT_SIGNING_KEY.'
    required: false
    default: ''
  git-gpg-sign:
    description: 'Sign the commits (true/false). Only needed when git is not configured yet. Falls back to GIT_GPG_SIGN.'
    required: false
    default: ''
  ssh-key-path:
    description: 'Path to the SSH private key used to reach the git server. Only needed when SSH is not configured yet. Falls back to GIT_SSH_KEY_PATH.'
    required: false
    default: ''

outputs:
  processed:
    description: 'Number of zip packages that were processed.'
    value: ${{ steps.octozipo.outputs.processed }}
  created:
    description: 'Number of repositories that were created (push-create).'
    value: ${{ steps.octozipo.outputs.created }}
  updated:
    description: 'Number of existing repositories that received a new commit.'
    value: ${{ steps.octozipo.outputs.updated }}
  unchanged:
    description: 'Number of existing repositories that already matched the package.'
    value: ${{ steps.octozipo.outputs.unchanged }}
  pending:
    description: 'Number of new repositories that were prepared but not pushed (push-create is off).'
    value: ${{ steps.octozipo.outputs.pending }}
  skipped:
    description: 'Number of packages that could not be unzipped.'
    value: ${{ steps.octozipo.outputs.skipped }}
  failed:
    description: 'Number of packages whose repository could not be updated.'
    value: ${{ steps.octozipo.outputs.failed }}
  dry-run:
    description: 'Number of packages that were processed without pushing (dry-run).'
    value: ${{ steps.octozipo.outputs.dry-run }}
  repositories:
    description: 'Comma separated list of the repositories (org/repo) that were created or updated.'
    value: ${{ steps.octozipo.outputs.repositories }}
  report:
    description: 'JSON array with one object per package: status, zip, git_url, org, repo, branch and version.'
    value: ${{ steps.octozipo.outputs.report }}
  report-file:
    description: 'Path of the tab separated report file (status, zip, git url, org, repo, branch, version).'
    value: ${{ steps.octozipo.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Run Octozipo
      id: octozipo
      shell: bash
      env:
        INPUT_ZIP_DIR: ${{ inputs.zip-dir }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_GIT_URL: ${{ inputs.git-url }}
        INPUT_PUSH_CREATE: ${{ inputs.push-create }}
        INPUT_MAPPER: ${{ inputs.mapper }}
        INPUT_ENV_FILE: ${{ inputs.env-file }}
        INPUT_SPACER: ${{ inputs.spacer }}
        INPUT_GIT_DATE: ${{ inputs.git-date }}
        INPUT_USE_XML_NAME: ${{ inputs.use-xml-name }}
        INPUT_KEEP_REPO: ${{ inputs.keep-repo }}
        INPUT_KEEP_ZIP: ${{ inputs.keep-zip }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        INPUT_REPORT_FILE: ${{ inputs.report-file }}
        INPUT_GIT_USER: ${{ inputs.git-user }}
        INPUT_GIT_EMAIL: ${{ inputs.git-email }}
        INPUT_GIT_SIGNING_KEY: ${{ inputs.git-signing-key }}
        INPUT_GIT_GPG_SIGN: ${{ inputs.git-gpg-sign }}
        INPUT_SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
      run: |
        chmod +x "${GITHUB_ACTION_PATH}/src/action.sh" "${GITHUB_ACTION_PATH}/src/octozipo"
        "${GITHUB_ACTION_PATH}/src/action.sh"
